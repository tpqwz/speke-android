name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      # The GitHub Ubuntu image already has the SDK. setup-android@v3 fails
      # because it still asks sdkmanager for the removed "tools" package.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Phone APK plus the x86_64 emulator image. The included libsignal build
      # reads this as its androidArchs property.
      ORG_GRADLE_PROJECT_androidArchs: aarch64,x86_64
      SPEKE_CI_ABIS: arm64-v8a,x86_64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle

    - name: Install SDK and NDK
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager --install "ndk;28.2.13676358"
        sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"

    - name: Install native build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev cmake make protobuf-compiler libprotobuf-dev python3

    - name: Install the libsignal Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-03-23
        targets: aarch64-linux-android,x86_64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: deps/libsignal

    - name: Build the debug APK
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleMonocleschatFreeDebug \
          -x :java:makeJniLibrariesDesktop \
          -x :java:makeJniLibrariesServer

    - uses: actions/upload-artifact@v4
      with:
        name: speke-debug-apk
        if-no-files-found: error
        path: build/outputs/apk/monocleschatFree/debug/*.apk

    - name: Publish the APK on Releases
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' build.gradle | head -1)
        test -n "$version"
        tag="v${version}"
        stage=$(mktemp -d)
        for apk in build/outputs/apk/monocleschatFree/debug/*.apk; do
          base=$(basename "$apk")
          abi=${base#monocleschat-free-}
          abi=${abi%-debug.apk}
          cp "$apk" "$stage/Speke-${version}-${abi}-debug.apk"
        done
        notes=$(printf '%s\n' \
          "Debug APKs built from ${GITHUB_SHA}." \
          "" \
          "Speke-${version}-arm64-v8a-debug.apk is the phone build." \
          "Speke-${version}-x86_64-debug.apk is the emulator build." \
          "" \
          "These builds are debug-signed.")
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$tag" "$stage"/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes" --prerelease
        else
          gh release create "$tag" "$stage"/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "$notes" \
            --prerelease
        fi
