name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      # Phone APK plus the x86_64 emulator image. The included libsignal build
      # reads this as its androidArchs property.
      ORG_GRADLE_PROJECT_androidArchs: aarch64,x86_64
      LANOXE_CI_ABIS: arm64-v8a,x86_64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle

    - uses: android-actions/setup-android@v3

    - name: Install SDK and NDK
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platforms;android-37" "ndk;28.2.13676358"

    - name: Install native build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang libclang-dev cmake make protobuf-compiler libprotobuf-dev python3

    - name: Install the libsignal Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-03-23
        targets: aarch64-linux-android,x86_64-linux-android

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: deps/libsignal

    - name: Build the debug APK
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleMonocleschatFreeDebug \
          -x :java:makeJniLibrariesDesktop \
          -x :java:makeJniLibrariesServer

    - uses: actions/upload-artifact@v4
      with:
        name: lanoxe-debug-apk
        if-no-files-found: error
        path: build/outputs/apk/monocleschatFree/debug/*.apk
